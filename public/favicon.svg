<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#235049"/>
      <stop offset="1" stop-color="#142a2c"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background (maskable: OS rounds the corners) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- faint board grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="3">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="170" x2="512" y2="170"/>
    <line x1="0" y1="341" x2="512" y2="341"/>
  </g>

  <!-- soft overhead light -->
  <ellipse cx="256" cy="110" rx="250" ry="130" fill="#ffffff" opacity="0.07"/>

  <!-- pawn shadow -->
  <ellipse cx="256" cy="412" rx="96" ry="24" fill="#000000" opacity="0.28"/>

  <!-- pawn base disc (accent) -->
  <ellipse cx="256" cy="404" rx="90" ry="22" fill="#D8553F"/>

  <!-- pawn body + head (cream) -->
  <path d="M 188 396 C 174 322, 210 270, 231 238 C 241 225, 271 225, 281 238 C 302 270, 338 322, 324 396 Z" fill="#F3E9D2"/>
  <circle cx="256" cy="168" r="66" fill="#F3E9D2"/>
  <circle cx="232" cy="146" r="16" fill="#ffffff" opacity="0.55"/>
</svg>
